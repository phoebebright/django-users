# django_users IdP setup blueprint.
#
# Two things in one file because they share the same prompt + user-write
# stages:
#
#   1. Must-change-password gate on the authentication flow.
#      Forces a user to set a new password at next login when they have
#      attributes.must_change_password = True. Clears the flag once done.
#      Trigger: GenerateOTP sets the flag whenever an admin issues a
#      6-digit OTP from the manage-user page.
#
#   2. Recovery flow + brand wiring.
#      Authentik's POST /users/{id}/recovery/ endpoint requires a recovery
#      flow to exist AND for the brand serving the request to point at it
#      via flow_recovery. We create the flow and patch the default brand.
#
# Apply via:
#   - Authentik blueprint loader (drop into ./blueprints mount), OR
#   - python manage.py setup_authentik_must_change
#
# Both produce equivalent state. The management command additionally
# patches any *host-specific* brand whose ``domain`` matches the runtime
# AUTHENTIK['URL'] host — useful when Authentik is on localhost:9000 in
# dev and the matching brand isn't the default one. The blueprint can't
# do that because it has no notion of where Django is calling from; if
# you have host-specific brands, prefer the management command.
#
# Re-applying is a no-op.

version: 1
metadata:
  name: django_users IdP setup
  labels:
    blueprints.goauthentik.io/system: "false"

entries:
  # ---- policies -----------------------------------------------------------

  - identifiers:
      name: must_change_password_pending
    model: authentik_policies_expression.expressionpolicy
    id: pol_must_change
    attrs:
      execution_logging: false
      expression: |
        return bool(request.user.attributes.get("must_change_password"))

  - identifiers:
      name: clear_must_change_password
    model: authentik_policies_expression.expressionpolicy
    id: pol_clear
    attrs:
      execution_logging: false
      expression: |
        user = request.user
        attrs = dict(user.attributes or {})
        attrs.pop("must_change_password", None)
        user.attributes = attrs
        user.save()
        return True

  # ---- prompt fields -----------------------------------------------------

  - identifiers:
      field_key: must_change_password
    model: authentik_stages_prompt.prompt
    id: prompt_password
    attrs:
      label: New password
      type: password
      required: true
      placeholder: New password
      order: 0

  - identifiers:
      field_key: must_change_password_repeat
    model: authentik_stages_prompt.prompt
    id: prompt_password_repeat
    attrs:
      label: Confirm new password
      type: password
      required: true
      placeholder: Confirm new password
      order: 1

  # ---- stages ------------------------------------------------------------

  - identifiers:
      name: prompt-set-new-password
    model: authentik_stages_prompt.promptstage
    id: stage_prompt
    attrs:
      fields:
        - !KeyOf prompt_password
        - !KeyOf prompt_password_repeat

  - identifiers:
      name: user-write-new-password
    model: authentik_stages_user_write.userwritestage
    id: stage_write
    attrs:
      user_creation_mode: never_create

  # ---- bindings into the existing authentication flow --------------------
  # Adjust the slug below if your auth flow has a different one.

  - identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !KeyOf stage_prompt
      order: 30
    model: authentik_flows.flowstagebinding
    id: binding_prompt
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
      policy_engine_mode: any

  - identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !KeyOf stage_write
      order: 31
    model: authentik_flows.flowstagebinding
    id: binding_write
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
      policy_engine_mode: any

  # ---- attach policies to the bindings -----------------------------------

  - identifiers:
      target: !KeyOf binding_prompt
      policy: !KeyOf pol_must_change
      order: 0
    model: authentik_policies.policybinding
    attrs:
      enabled: true

  - identifiers:
      target: !KeyOf binding_write
      policy: !KeyOf pol_must_change
      order: 0
    model: authentik_policies.policybinding
    attrs:
      enabled: true

  - identifiers:
      target: !KeyOf binding_write
      policy: !KeyOf pol_clear
      order: 1
    model: authentik_policies.policybinding
    attrs:
      enabled: true

  # ---- recovery flow -----------------------------------------------------
  # Reuses the prompt + user-write stages above. No policies on these
  # bindings — the recovery link itself authenticates the user, so the
  # stages always run when the flow is entered via that link.

  - identifiers:
      slug: default-recovery-flow
    model: authentik_flows.flow
    id: recovery_flow
    attrs:
      name: Recovery flow
      title: Reset your password
      designation: recovery
      authentication: none
      denied_action: message_continue
      policy_engine_mode: any
      layout: stacked

  - identifiers:
      target: !KeyOf recovery_flow
      stage: !KeyOf stage_prompt
      order: 10
    model: authentik_flows.flowstagebinding
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
      policy_engine_mode: any

  - identifiers:
      target: !KeyOf recovery_flow
      stage: !KeyOf stage_write
      order: 20
    model: authentik_flows.flowstagebinding
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
      policy_engine_mode: any

  # ---- brand wiring ------------------------------------------------------
  # Patches the *default* brand to point at the recovery flow. If your
  # AUTHENTIK['URL'] host matches a non-default brand (e.g.
  # localhost:9000), use the management command instead — it patches
  # every brand whose domain matches the runtime host.

  - identifiers:
      domain: authentik-default
    model: authentik_brands.brand
    attrs:
      flow_recovery: !KeyOf recovery_flow
