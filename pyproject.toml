[build-system]
requires = ["setuptools>=65.5.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-users"
version = "3.0.0"
description = "A reusable Django app to manage users; AUTH_PROVIDER selects django, keycloak or authentik auth (unified-auth branch)."
readme = "README.md"
license = {text = "MIT License"}
authors = [
    {name = "Phoebe Bright", email = "phoebebright310@gmail.com"}
]
requires-python = ">=3.10"
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "Django>=5.1,<7.0",
    "setuptools>=65.5.1",
    # idp.py (imported everywhere) uses httpx for the Authentik REST adapter,
    # so it is a core dependency even for keycloak/django hosts.
    "httpx",
]

[project.optional-dependencies]
# Install the extra matching your AUTH_PROVIDER; plain django auth needs neither.
keycloak = [
    "django-keycloak-admin @ git+https://github.com/phoebebright/django-keycloak-admin",
]
authentik = [
    "mozilla-django-oidc",
]

[project.urls]
Homepage = "https://github.com/phoebebright/django-users"
Repository = "https://github.com/phoebebright/django-users"

[tool.setuptools]
include-package-data = true


[tool.setuptools.packages.find]
where = ["."]
include = ["django_users", "django_users.*"]



[tool.setuptools.package-data]
# key is the import path of your app
"skorie_news" = ["templates/**/*.html", "templates/**/*.txt","templates/**/*.handlebars", "static/**/*"]

django_users = [
  "templates/**/*",
  "static/**/*",
  "management/**/*",
  "docs/**/*",
    "tools/**/*",
]
