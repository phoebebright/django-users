[build-system]
requires = ["setuptools>=65.5.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-users"
version = "3.0.0"
description = "A reusable Django app to manage users; AUTH_PROVIDER selects django, keycloak or authentik auth (unified-auth branch)."
readme = "README.md"
license = {text = "MIT License"}
authors = [
    {name = "Phoebe Bright", email = "phoebebright310@gmail.com"}
]
requires-python = ">=3.10"
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "Django>=5.1,<7.0",
    "setuptools>=65.5.1",
    # idp.py (imported everywhere) uses httpx for the Authentik REST adapter,
    # so it is a core dependency even for keycloak/django hosts.
    "httpx",
    # The models -> utils import chain imports all of these at module top
    # level, so the app fails to import if any is missing. They were only in
    # requirements.txt, which pip ignores on git+https installs — pip reads
    # this list instead. (twilio is also imported top-level in utils.py but is
    # deliberately left out for now — declare it here if a clean install
    # starts failing on it.)
    "email-validator",
    "nanoid",
    "django-countries",
    "django-timezone-field",
    "django-yamlfield @ git+https://github.com/phoebebright/django-yamlfield",
]

[project.optional-dependencies]
# Install the extra matching your AUTH_PROVIDER; plain django auth needs neither.
keycloak = [
    "django-keycloak-admin @ git+https://github.com/phoebebright/django-keycloak-admin",
]
authentik = [
    "mozilla-django-oidc",
]

[project.urls]
Homepage = "https://github.com/phoebebright/django-users"
Repository = "https://github.com/phoebebright/django-users"

[tool.setuptools]
include-package-data = true


[tool.setuptools.packages.find]
where = ["."]
include = ["django_users", "django_users.*"]



[tool.setuptools.package-data]
# key is the import path of your app
"skorie_news" = ["templates/**/*.html", "templates/**/*.txt","templates/**/*.handlebars", "static/**/*"]

django_users = [
  "templates/**/*",
  "static/**/*",
  "management/**/*",
  "docs/**/*",
    "tools/**/*",
]
